  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // 洗練されたカラー定義（ダークグレー、ライトグレー、グレージュ、アースカラー等）
    const NODE_COLORS = [
      { id: 'white', name: 'ホワイト', bg: 'bg-white', border: 'border-slate-200', text: 'text-slate-800', pathText: 'text-slate-500', pathBg: 'bg-slate-100', inputBg: 'bg-slate-50', actionBtn: 'text-slate-400 hover:text-indigo-600 hover:bg-indigo-50', deleteBtn: 'text-slate-400 hover:text-red-600 hover:bg-red-50' },
      { id: 'lightgrey', name: 'ライトグレー', bg: 'bg-slate-100', border: 'border-slate-300', text: 'text-slate-800', pathText: 'text-slate-500', pathBg: 'bg-slate-200/60', inputBg: 'bg-slate-50', actionBtn: 'text-slate-500 hover:text-indigo-600 hover:bg-indigo-50', deleteBtn: 'text-slate-500 hover:text-red-600 hover:bg-red-50' },
      { id: 'darkgrey', name: 'ダークグレー', bg: 'bg-[#555a64]', border: 'border-[#3f434a]', text: 'text-white', pathText: 'text-slate-200', pathBg: 'bg-[#3f434a]/60', inputBg: 'bg-[#6c727d]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-300 hover:bg-red-900/50' },
      { id: 'greige', name: 'グレージュ', bg: 'bg-[#E5E0DB]', border: 'border-[#c8bfa7]', text: 'text-[#4a3f35]', pathText: 'text-[#6e5d4f]', pathBg: 'bg-[#f0ece9]', inputBg: 'bg-[#f5f2f0]', actionBtn: 'text-[#6e5d4f] hover:text-indigo-600 hover:bg-indigo-50', deleteBtn: 'text-[#6e5d4f] hover:text-red-600 hover:bg-red-50' },
      { id: 'olive', name: 'アース(オリーブ)', bg: 'bg-[#7D846C]', border: 'border-[#626853]', text: 'text-white', pathText: 'text-[#d2d6c9]', pathBg: 'bg-[#5d624e]', inputBg: 'bg-[#8f967d]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'terracotta', name: 'アース(テラコッタ)', bg: 'bg-[#C17A61]', border: 'border-[#9c5942]', text: 'text-white', pathText: 'text-[#f2ded6]', pathBg: 'bg-[#9c5942]', inputBg: 'bg-[#d2957e]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'yellow', name: 'イエロー', bg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-900', pathText: 'text-amber-700', pathBg: 'bg-amber-200/60', inputBg: 'bg-amber-50', actionBtn: 'text-amber-600 hover:text-amber-800 hover:bg-amber-200/50', deleteBtn: 'text-amber-600 hover:text-red-600 hover:bg-red-100' },
      { id: 'mint', name: 'ミント', bg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-900', pathText: 'text-emerald-700', pathBg: 'bg-emerald-200/60', inputBg: 'bg-emerald-50', actionBtn: 'text-emerald-600 hover:text-emerald-800 hover:bg-emerald-200/50', deleteBtn: 'text-emerald-600 hover:text-red-600 hover:bg-red-100' },
      { id: 'sky', name: 'スカイ', bg: 'bg-sky-100', border: 'border-sky-300', text: 'text-sky-900', pathText: 'text-sky-700', pathBg: 'bg-sky-200/60', inputBg: 'bg-sky-50', actionBtn: 'text-sky-600 hover:text-sky-800 hover:bg-sky-200/50', deleteBtn: 'text-sky-600 hover:text-red-600 hover:bg-red-100' },
      { id: 'red', name: 'レッド', bg: 'bg-red-500', border: 'border-red-600', text: 'text-white', pathText: 'text-red-100', pathBg: 'bg-red-600/50', inputBg: 'bg-red-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'orange', name: 'オレンジ', bg: 'bg-orange-500', border: 'border-orange-600', text: 'text-white', pathText: 'text-orange-100', pathBg: 'bg-orange-600/50', inputBg: 'bg-orange-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-[#b04020]' },
      { id: 'green', name: 'グリーン', bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white', pathText: 'text-emerald-100', pathBg: 'bg-emerald-600/50', inputBg: 'bg-emerald-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'teal', name: 'ティール', bg: 'bg-teal-600', border: 'border-teal-700', text: 'text-white', pathText: 'text-teal-100', pathBg: 'bg-teal-700/50', inputBg: 'bg-teal-500', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'blue', name: 'ブルー', bg: 'bg-blue-500', border: 'border-blue-600', text: 'text-white', pathText: 'text-blue-100', pathBg: 'bg-blue-600/50', inputBg: 'bg-blue-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'indigo', name: 'インディゴ', bg: 'bg-indigo-500', border: 'border-indigo-600', text: 'text-white', pathText: 'text-indigo-100', pathBg: 'bg-indigo-600/50', inputBg: 'bg-indigo-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'purple', name: 'パープル', bg: 'bg-purple-500', border: 'border-purple-600', text: 'text-white', pathText: 'text-purple-100', pathBg: 'bg-purple-600/50', inputBg: 'bg-[#b060f0]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'slate', name: 'スレート', bg: 'bg-slate-700', border: 'border-slate-800', text: 'text-white', pathText: 'text-slate-200', pathBg: 'bg-slate-800/50', inputBg: 'bg-slate-600', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-300 hover:bg-red-900/50' },
    ];

    const getColorClass = (colorId) => {
      return NODE_COLORS.find(c => c.id === colorId) || NODE_COLORS[0];
    };

    // 初期データ：★ 保存（エクスポート）時にこの変数領域が書き換えられてHTMLが再生成されます
    const initialData = [
      {
        "id": "root-lp",
        "title": "ランディングページ",
        "path": "/",
        "color": "indigo",
        "isExpanded": true,
        "isHeaderMenu": true,
        "children": [
          { "id": "lp-1", "title": "メインビジュアル", "path": "#top", "color": "greige", "isExpanded": true, "isHeaderMenu": false, "children": [] },
          { "id": "lp-2", "title": "選ばれる理由・特徴", "path": "#features", "color": "greige", "isExpanded": true, "isHeaderMenu": true, "children": [] },
          { "id": "lp-3", "title": "サービス内容紹介", "path": "#services", "color": "greige", "isExpanded": true, "isHeaderMenu": true, "children": [] },
          { "id": "lp-4", "title": "導入実績・事例", "path": "#case-studies", "color": "greige", "isExpanded": true, "isHeaderMenu": true, "children": [] },
          { "id": "lp-5", "title": "会社情報・概要", "path": "#about", "color": "greige", "isExpanded": true, "isHeaderMenu": true, "children": [] },
          { "id": "lp-6", "title": "お問い合わせフォーム", "path": "#contact", "color": "terracotta", "isExpanded": true, "isHeaderMenu": true, "children": [] }
        ]
      }
    ];

    // テンプレート用の複数ページ標準ウェブサイト構成
    const multiPageTemplate = [
      {
        id: 'root-1',
        title: 'ホーム',
        path: '/',
        color: 'green',
        isExpanded: true,
        isHeaderMenu: true,
        children: [
          {
            id: 'child-1',
            title: '会社概要',
            path: '/about',
            color: 'green',
            isExpanded: true,
            isHeaderMenu: true,
            children: [
               { id: 'child-1-1', title: '代表挨拶', path: '/about/message', color: 'green', isExpanded: true, isHeaderMenu: false, children: [] },
               { id: 'child-1-2', title: 'アクセス', path: '/about/access', color: 'green', isExpanded: true, isHeaderMenu: false, children: [] }
            ]
          },
          {
            id: 'child-2',
            title: 'サービス',
            path: '/services',
            color: 'green',
            isExpanded: true,
            isHeaderMenu: true,
            children: [
               { id: 'child-2-1', title: 'Webサイト制作', path: '/services/web', color: 'green', isExpanded: true, isHeaderMenu: false, children: [] },
               { id: 'child-2-2', title: 'システム開発', path: '/services/system', color: 'green', isExpanded: true, isHeaderMenu: false, children: [] },
               { id: 'child-2-3', title: 'マーケティング', path: '/services/marketing', color: 'green', isExpanded: true, isHeaderMenu: false, children: [] }
            ]
          },
          {
            id: 'child-3',
            title: '採用情報',
            path: '/recruit',
            color: 'green',
            isExpanded: true,
            isHeaderMenu: true,
            children: []
          },
          {
            id: 'child-4',
            title: 'お問い合わせ',
            path: '/contact',
            color: 'green',
            isExpanded: true,
            isHeaderMenu: true,
            children: []
          }
        ]
      }
    ];

    // テンプレート用のシングルページ（LP）構成
    const singlePageTemplate = [
      {
        id: 'root-lp',
        title: 'ランディングページ',
        path: '/',
        color: 'indigo',
        isExpanded: true,
        isHeaderMenu: true,
        children: [
          { id: 'lp-1', title: 'メインビジュアル', path: '#top', color: 'greige', isExpanded: true, isHeaderMenu: false, children: [] },
          { id: 'lp-2', title: '選ばれる理由・特徴', path: '#features', color: 'greige', isExpanded: true, isHeaderMenu: true, children: [] },
          { id: 'lp-3', title: 'サービス内容紹介', path: '#services', color: 'greige', isExpanded: true, isHeaderMenu: true, children: [] },
          { id: 'lp-4', title: '導入実績・事例', path: '#case-studies', color: 'greige', isExpanded: true, isHeaderMenu: true, children: [] },
          { id: 'lp-5', title: '会社情報・概要', path: '#about', color: 'greige', isExpanded: true, isHeaderMenu: true, children: [] },
          { id: 'lp-6', title: 'お問い合わせフォーム', path: '#contact', color: 'terracotta', isExpanded: true, isHeaderMenu: true, children: [] }
        ]
      }
    ];

    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

    // トースト通知コンポーネント
    const Toast = ({ message, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          onClose();
        }, 3000);
        return () => clearTimeout(timer);
      }, [message, onClose]);

      if (!message) return null;

      return (
        <div className="fixed bottom-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50 animate-fade-in">
          <svg className="w-5 h-5 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span className="font-medium text-sm">{message}</span>
        </div>
      );
    };

    // ノード数のカウント
    const countNodes = (node) => {
      let count = 1;
      if (node.children && node.children.length > 0) {
        node.children.forEach(child => {
          count += countNodes(child);
        });
      }
      return count;
    };

    // ディレクトリマップ
    const DirectoryMap = ({ data, onShowToast, isExportingPDF }) => {
      const rows = [];
      let maxLevel = 1;

      const traverse = (nodes, level) => {
        nodes.forEach(node => {
          if (level > maxLevel) maxLevel = level;
          rows.push({
            node,
            level,
            rowSpan: countNodes(node)
          });
          if (node.children && node.children.length > 0) {
            traverse(node.children, level + 1);
          }
        });
      };
      traverse(data, 1);

      const getLevelBgColor = (level) => {
        switch (level) {
          case 1: return 'bg-[#cce0ff]'; 
          case 2: return 'bg-[#e2f0d9]'; 
          case 3: return 'bg-white';     
          case 4: return 'bg-[#fff2cc]'; 
          case 5: return 'bg-[#fce4d6]'; 
          default: return 'bg-white';
        }
      };

      const handleExportExcel = () => {
        let html = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office"
                xmlns:x="urn:schemas-microsoft-com:office:excel"
                xmlns="http://www.w3.org/TR/REC-html40">
          <head>
          <meta charset="utf-8" />
          <style>
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #94a3b8; font-family: sans-serif; font-size: 13px; padding: 6px; text-align: left; vertical-align: top; }
            th { background-color: #f8fafc; font-weight: bold; text-align: center; }
            .bg-level-1 { background-color: #cce0ff; }
            .bg-level-2 { background-color: #e2f0d9; }
            .bg-level-3 { background-color: #ffffff; }
            .bg-level-4 { background-color: #fff2cc; }
            .bg-level-5 { background-color: #fce4d6; }
          </style>
          </head>
          <body>
            <table>
              <thead>
                <tr>
        `;

        for (let i = 1; i <= maxLevel; i++) {
          html += `<th style="width: 120px;">第${i}階層</th>`;
        }
        html += `<th style="width: 250px;">URL / アンカー</th></tr></thead><tbody>`;

        rows.forEach(row => {
          const isAnchor = row.node.path && row.node.path.startsWith('#');
          let pathDisplay = isAnchor ? `[アンカー] ${row.node.path}` : row.node.path;
          if (row.node.isHeaderMenu) {
            pathDisplay = `[🧭ナビ表示] ` + pathDisplay;
          }

          html += `<tr>`;
          for (let l = 1; l <= maxLevel; l++) {
            let rowLevelColorClass = `bg-level-${row.level > 5 ? 3 : row.level}`;
            if (l === row.level) {
              html += `<td rowspan="${row.rowSpan}" class="${rowLevelColorClass}" style="font-weight: bold;">${row.node.title}</td>`;
            } else if (l > row.level) {
              html += `<td class="${rowLevelColorClass}"></td>`;
            }
          }
          html += `<td class="bg-level-${row.level > 5 ? 3 : row.level}" style="font-family: monospace;">${pathDisplay}</td></tr>`;
        });

        html += `</tbody></table></body></html>`;

        const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'directory_map.xls';
        a.click();
        URL.revokeObjectURL(url);
        if(onShowToast) onShowToast('Excel用ファイル(.xls)をダウンロードしました');
      };

      return (
        <div className={`p-4 sm:p-6 lg:p-8 ${isExportingPDF ? 'w-full px-0 py-0 max-w-none' : 'max-w-7xl mx-auto'}`}>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
            <div className="flex items-center gap-2 text-slate-800">
              <svg className="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 5.25h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5" /></svg>
              <h2 className="text-lg font-bold tracking-tight">ディレクトリマップ (ページ一覧)</h2>
            </div>
            {!isExportingPDF && (
              <button 
                onClick={handleExportExcel}
                className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-green-700 bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg transition-colors w-fit shadow-sm animate-fade-in"
              >
                <svg className="w-4 h-4 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                <span>Excel出力</span>
              </button>
            )}
          </div>
          <div className={`${isExportingPDF ? 'w-full border-none shadow-none' : 'overflow-x-auto border border-slate-400 shadow-sm'}`}>
            <table className={`text-sm text-left border-collapse bg-white ${isExportingPDF ? 'w-full mx-auto border border-slate-400' : 'w-full'}`}>
              <thead className={`text-sm text-slate-700 bg-slate-50 ${isExportingPDF ? '' : 'sticky top-0 z-10'}`}>
                <tr>
                  {Array.from({ length: maxLevel }).map((_, i) => (
                    <th key={i} className="px-4 py-2.5 font-bold border border-slate-400 text-center whitespace-nowrap min-w-[120px]">
                      第{i + 1}階層
                    </th>
                  ))}
                  <th className="px-4 py-2.5 font-bold border border-slate-400 text-center whitespace-nowrap min-w-[200px]">
                    URL / アンカー
                  </th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row) => {
                  const tds = [];
                  const isAnchor = row.node.path && row.node.path.startsWith('#');

                  for (let l = 1; l <= maxLevel; l++) {
                    if (l === row.level) {
                      tds.push(
                        <td 
                          key={l} 
                          rowSpan={row.rowSpan} 
                          className={`px-4 py-2.5 border border-slate-400 align-top ${getLevelBgColor(l)} font-bold text-slate-800`}
                        >
                          {row.node.title}
                        </td>
                      );
                    } else if (l > row.level) {
                      tds.push(
                        <td 
                          key={l} 
                          className={`px-4 py-2.5 border border-slate-400 ${getLevelBgColor(row.level)}`}
                        ></td>
                      );
                    }
                  }
                  return (
                    <tr key={row.node.id}>
                      {tds}
                      <td className={`px-4 py-2.5 border border-slate-400 font-mono text-[13px] text-slate-700 ${getLevelBgColor(row.level)} align-middle`}>
                        <div className="flex items-center gap-1.5 flex-wrap">
                          {isAnchor && (
                            <span className="px-1.5 py-0.5 text-[10px] font-bold bg-slate-200 text-slate-700 rounded select-none shrink-0">
                              ページ内セクション
                            </span>
                          )}
                          {row.node.isHeaderMenu && (
                            <span className="px-1.5 py-0.5 text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 rounded select-none shrink-0 flex items-center gap-1">
                              <svg className="w-3 h-3 text-indigo-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" /><path strokeLinecap="round" strokeLinejoin="round" d="M14.25 9.75l-4.5 1.5 1.5 4.5 4.5-1.5-1.5-4.5z" /></svg>
                              ヘッダーナビ掲載
                            </span>
                          )}
                          <span className="truncate">{row.node.path}</span>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // サイトマップツリーの個別ノード
    const OrgNode = ({ node, onAddChild, onAddSibling, onUpdate, onDelete, onToggle, level = 0, isExportingPDF }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [editTitle, setEditTitle] = useState(node.title);
      const [editPath, setEditPath] = useState(node.path);
      const [editColor, setEditColor] = useState(node.color || 'green');
      const [editHeaderMenu, setEditHeaderMenu] = useState(node.isHeaderMenu || false); 
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [showAddMenu, setShowAddMenu] = useState(false); 

      useEffect(() => {
        if (isEditing) {
          setEditTitle(node.title);
          setEditPath(node.path);
          setEditColor(node.color || 'green');
          setEditHeaderMenu(node.isHeaderMenu || false);
        }
      }, [isEditing, node.title, node.path, node.color, node.isHeaderMenu]);

      const handleSave = (e) => {
        e?.stopPropagation();
        if (!editTitle.trim()) return;
        onUpdate(node.id, { title: editTitle, path: editPath, color: editColor, isHeaderMenu: editHeaderMenu });
        setIsEditing(false);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') handleSave(e);
        if (e.key === 'Escape') {
          e.stopPropagation();
          setIsEditing(false);
        }
      };

      const isRoot = level === 0;
      const currentStyle = getColorClass(node.color || 'green');

      // パスが # から始まっている場合は、ページ内リンク（アンカー）として点線ボーダーを適用
      const isAnchorLink = node.path && node.path.startsWith('#');
      const borderClass = isAnchorLink ? 'border-dashed border-slate-400' : currentStyle.border;

      // このRootが「LP構成」の最上部であり、子供たちがアンカーリンクを持っているかを判定
      const isLPHeaderMode = isRoot && node.children && node.children.some(c => c.path && c.path.startsWith('#'));
      
      // 連動して表示されるヘッダーメニュー用の項目を抽出
      const headerMenuItems = node.children ? node.children.filter(c => c.isHeaderMenu) : [];

      if (isLPHeaderMode) {
        return (
          <li>
            <div className="relative inline-flex flex-col items-center group node-card animate-fade-in">
              {/* ★ LPのヘッダーナビゲーションバーを模した横長プレミアムデザイン (横幅をw-[920px]、最大幅をmax-w-[95vw]へ拡大) */}
              <div className={`border-2 rounded-xl p-4 w-[920px] max-w-[95vw] relative transition-all duration-300 shadow-md hover:shadow-lg
                ${currentStyle.bg} ${currentStyle.border}`}>
                
                {/* 補助ラベル */}
                <div className="flex items-center gap-1 text-[9px] font-bold text-indigo-500 uppercase tracking-widest mb-2.5">
                  <svg className="w-3 h-3 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>
                  <span>LP Global Navigation (親ヘッダー)</span>
                </div>

                {/* 擬似ヘッダーバー: 左端の・印スペースを完全に廃止し、横いっぱいに綺麗にストレッチするように等間隔配置 */}
                <div className="bg-white/70 backdrop-blur-sm rounded-lg px-4 py-3 border border-black/5 shadow-inner">
                  <div className="flex items-center justify-around w-full gap-2 overflow-x-auto scrollbar-none">
                    {headerMenuItems.length > 0 ? (
                      headerMenuItems.map(item => (
                        <span 
                          key={item.id} 
                          className="text-[11px] sm:text-xs font-bold text-slate-700 bg-white/95 px-4 py-2 rounded-lg border border-slate-200/80 shadow-sm truncate flex-1 text-center mx-1.5 select-none transition-all duration-200"
                          title={`${item.title} (${item.path})`}
                        >
                          {item.title}
                        </span>
                      ))
                    ) : (
                      <span className="text-[10px] text-slate-400 italic font-mono select-none w-full text-center">メニュー掲載項目がありません（セクションカードから「Gナビに表示」をONにしてください）</span>
                    )}
                  </div>
                </div>

                {/* 右上の追加ボタン */}
                {!isEditing && !isExportingPDF && (
                  <div className="absolute top-2 right-2 flex gap-0.5 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity z-20">
                    <button 
                      onClick={(e) => { e.stopPropagation(); setShowAddMenu(true); }} 
                      className={`p-1.5 rounded transition-colors ${currentStyle.actionBtn}`} 
                      title="子セクションを追加"
                    >
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    </button>
                  </div>
                )}

                {/* 追加メニュー（＋）を押した時だけ下部が展開するクリーン仕様 */}
                {showAddMenu && !isExportingPDF && (
                  <div className="mt-3.5 border-t border-black/5 pt-2">
                    <div className="flex flex-col items-center justify-center animate-fade-in" onClick={e => e.stopPropagation()}>
                      <span className="text-[10px] font-bold mb-1.5 text-slate-500">追加先を選択</span>
                      <div className="flex gap-2 w-full">
                        <button 
                          onClick={(e) => { e.stopPropagation(); onAddChild(node.id); setShowAddMenu(false); }}
                          className="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold rounded-lg transition-colors shadow-sm flex items-center justify-center gap-1"
                        >
                          <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" /></svg>
                          <span>下(子セクション)に追加</span>
                        </button>
                        <button 
                          onClick={(e) => { e.stopPropagation(); setShowAddMenu(false); }}
                          className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-bold rounded-lg transition-colors border border-slate-200"
                        >
                          閉じる
                        </button>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            </div>

            {/* 子ノード(セクション)の描画 */}
            {node.children.length > 0 && (
              <ul>
                {node.children.map(child => (
                  <OrgNode 
                    key={child.id} 
                    node={child} 
                    level={level + 1}
                    onAddChild={onAddChild}
                    onAddSibling={onAddSibling}
                    onUpdate={onUpdate}
                    onDelete={onDelete}
                    onToggle={onToggle}
                    isExportingPDF={isExportingPDF}
                  />
                ))}
              </ul>
            )}
          </li>
        );
      }

      return (
        <li>
          <div className="relative inline-flex flex-col items-center group node-card">
            {/* カード本体 */}
            <div className={`border-2 rounded-xl pt-5 pb-4 px-2 w-[190px] relative transition-all duration-300 shadow-sm hover:shadow-md
              ${currentStyle.bg}
              ${isEditing || showDeleteConfirm || showAddMenu ? 'ring-4 ring-indigo-100 border-indigo-400 z-10' : `${borderClass} hover:border-indigo-300`}`}>
              
              {/* 🧭 ヘッダーナビ掲載バッジの表示 */}
              {node.isHeaderMenu && !isEditing && !showDeleteConfirm && !showAddMenu && (
                <div className="absolute -top-3 left-4 bg-indigo-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 border border-indigo-500 shadow-sm animate-fade-in z-20">
                  <svg className="w-3 h-3 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" /><path strokeLinecap="round" strokeLinejoin="round" d="M14.25 9.75l-4.5 1.5 1.5 4.5 4.5-1.5-1.5-4.5z" /></svg>

                </div>
              )}

              {/* 各種アクションボタン */}
              {!isEditing && !showDeleteConfirm && !showAddMenu && !isExportingPDF && (
                <div className="absolute top-1 right-1 flex gap-0.5 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity z-20">
                  <button 
                    onClick={(e) => { e.stopPropagation(); setShowAddMenu(true); }} 
                    className={`p-1.5 rounded transition-colors ${currentStyle.actionBtn}`} 
                    title="追加メニューを表示"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                  </button>
                  {!isRoot && (
                    <button 
                      onClick={(e) => { e.stopPropagation(); setShowDeleteConfirm(true); }} 
                      className={`p-1.5 rounded transition-colors ${currentStyle.deleteBtn}`} 
                      title="削除"
                    >
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                    </button>
                  )}

              {/* コンテンツエリア */}
              <div className="min-h-[64px] flex flex-col justify-center">
                {showDeleteConfirm && !isExportingPDF ? (
                  <div className="flex flex-col items-center justify-center animate-fade-in" onClick={e => e.stopPropagation()}>
                    <span className={`text-xs font-bold mb-2 ${currentStyle.text === 'text-white' ? 'text-white' : 'text-red-600'}`}>削除しますか？</span>
                    <div className="flex gap-2">
                      <button onClick={(e) => { e.stopPropagation(); onDelete(node.id); }} className="px-3 py-1.5 bg-red-600 text-white text-xs font-bold rounded-lg hover:bg-red-700 transition-colors shadow-sm">はい</button>
                      <button onClick={(e) => { e.stopPropagation(); setShowDeleteConfirm(false); }} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-colors shadow-sm ${currentStyle.text === 'text-white' ? 'bg-white/20 text-white hover:bg-white/30' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'}`}>いいえ</button>
                    </div>
                  </div>
                ) : showAddMenu && !isExportingPDF ? (
                  <div className="flex flex-col items-center justify-center animate-fade-in" onClick={e => e.stopPropagation()}>
                    <span className={`text-[11px] font-bold mb-1.5 ${currentStyle.text === 'text-white' ? 'text-white/80' : 'text-slate-500'}`}>追加先を選択</span>
                    <div className="grid grid-cols-3 gap-1 w-full">
                      {!isRoot ? (
                        <button 
                          onClick={(e) => { e.stopPropagation(); onAddSibling(node.id, 'left'); setShowAddMenu(false); }}
                          className="py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold rounded-lg transition-colors shadow-sm flex flex-col items-center justify-center"
                          title="同じ階層の左側に追加"
                        >
                          <span className="text-sm font-semibold">←</span>
                          <span className="scale-90 origin-center">左隣</span>
                        </button>
                      ) : (
                        <div className="py-1.5 text-slate-400 text-[10px] flex items-center justify-center bg-slate-100 rounded-lg select-none border border-slate-200">
                          -
                        </div>
                      )}
                      
                      <button 
                        onClick={(e) => { e.stopPropagation(); onAddChild(node.id); setShowAddMenu(false); }}
                        className="py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold rounded-lg transition-colors shadow-sm flex flex-col items-center justify-center"
                        title="子ページを追加"
                      >
                        <span className="text-sm font-semibold">↓</span>
                        <span className="scale-90 origin-center">下(子)</span>
                      </button>

                      {!isRoot ? (
                        <button 
                          onClick={(e) => { e.stopPropagation(); onAddSibling(node.id, 'right'); setShowAddMenu(false); }}
                          className="py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold rounded-lg transition-colors shadow-sm flex flex-col items-center justify-center"
                          title="同じ階層 of 右側に追加"
                        >
                          <span className="text-sm font-semibold">→</span>
                          <span className="scale-90 origin-center">右隣</span>
                        </button>
                      ) : (
                        <div className="py-1.5 text-slate-400 text-[10px] flex items-center justify-center bg-slate-100 rounded-lg select-none border border-slate-200">
                          -
                        </div>
                      )}
                    </div>
                    <button 
                      onClick={(e) => { e.stopPropagation(); setShowAddMenu(false); }}
                      className={`mt-1.5 w-full py-1 text-[10px] font-bold rounded-md transition-colors border ${
                        currentStyle.text === 'text-white' 
                          ? 'bg-white/10 text-white border-white/20 hover:bg-white/20' 
                          : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                      }`}
                    >
                      キャンセル
                    </button>
                  </div>
                ) : isEditing && !isExportingPDF ? (
                  <div className="flex flex-col gap-2 px-1" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-center flex-wrap gap-1.5 mb-1 bg-white/90 backdrop-blur-sm p-1.5 rounded-lg border border-slate-200/50 shadow-sm w-full relative z-20">
                      {NODE_COLORS.map(c => (
                        <button
                          key={c.id}
                          onClick={(e) => { e.stopPropagation(); setEditColor(c.id); }}
                          className={`w-5 h-5 rounded-full border shadow-sm transition-all ${c.bg} ${c.border} ${editColor === c.id ? 'ring-2 ring-offset-1 ring-indigo-500 scale-110 z-10' : 'hover:scale-110'}`}
                          title={c.name}
                          type="button"
                        />
                      ))}
                    </div>
                    <input
                      autoFocus
                      value={editTitle}
                      onChange={(e) => setEditTitle(e.target.value)}
                      onKeyDown={handleKeyDown}
                      className={`w-full px-2 py-1 text-sm font-bold border-b border-white/30 focus:border-white focus:outline-none text-center ${currentStyle.inputBg} ${currentStyle.text} placeholder:text-current placeholder:opacity-50 rounded transition-colors`}
                      placeholder="タイトル"
                    />
                    <input
                      value={editPath}
                      onChange={(e) => setEditPath(e.target.value)}
                      onKeyDown={handleKeyDown}
                      className={`w-full px-2 py-0.5 text-xs font-mono border-b border-white/30 focus:border-white focus:outline-none text-center ${currentStyle.inputBg} ${currentStyle.text} placeholder:text-current placeholder:opacity-50 rounded mt-0.5 transition-colors`}
                      placeholder="/path または #anchor"
                    />
                    
                    {/* ★ ヘッダーナビ掲載切り替えトグル */}
                    <div className="flex items-center justify-between mt-1 px-1 py-1 rounded bg-black/10 border border-white/5">
                      <span className={`text-[10px] font-bold ${currentStyle.text === 'text-white' ? 'text-white/80' : 'text-slate-500'}`}>Gナビに表示</span>
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); setEditHeaderMenu(!editHeaderMenu); }}
                        className={`w-10 h-5 flex items-center rounded-full p-0.5 transition-colors duration-200 focus:outline-none ${editHeaderMenu ? 'bg-indigo-600' : 'bg-slate-300'}`}
                      >
                        <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-200 ${editHeaderMenu ? 'translate-x-5' : 'translate-x-0'}`}></div>
                      </button>
                    </div>

                    <div className="flex justify-center gap-2 mt-1">
                      <button onClick={handleSave} className="flex-1 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors shadow-sm flex justify-center items-center">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
                      </button>
                      <button onClick={(e) => { e.stopPropagation(); setIsEditing(false); }} className={`flex-1 py-1.5 rounded-lg transition-colors shadow-sm flex justify-center items-center ${currentStyle.text === 'text-white' ? 'bg-white/20 text-white hover:bg-white/30' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'}`}>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                      </button>
                    </div>
                  </div>
                ) : (
                  <div 
                    className="cursor-text text-center px-2 py-3 flex flex-col items-center w-full"
                    onClick={(e) => { if (!isExportingPDF) { e.stopPropagation(); setIsEditing(true); } }}
                  >
                    <div 
                      className={`font-bold ${currentStyle.text} text-[15px] w-full px-1 mb-1.5`}
                      style={{ lineHeight: '1.4', wordBreak: 'break-word', overflowWrap: 'break-word' }}
                    >
                      {node.title}
                    </div>
                    {/* アンカーリンク / URLバッジ */}
                    <div className={`inline-flex items-center justify-center gap-1 ${currentStyle.pathBg} rounded-md px-3 py-1.5 max-w-[95%] border border-white/20`}>
                      {isAnchorLink && (
                        <svg className={`w-3 h-3 ${currentStyle.pathText} shrink-0`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-3.182.879m4.136-1.517l2.25-2.25m-3-1.125a4.5 4.5 0 00-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397" /></svg>
                      )}
                      <div 
                        className={`text-[11px] ${currentStyle.pathText} font-mono`}
                        style={{ lineHeight: '1.2', wordBreak: 'break-all', paddingBottom: '1px' }}
                      >
                        {node.path || '/'}
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* 開閉トグルボタン */}
              {node.children.length > 0 && !isExportingPDF && (
                <button 
                  onClick={(e) => { e.stopPropagation(); onToggle(node.id); }}
                  className="absolute -bottom-3.5 left-1/2 -translate-x-1/2 w-7 h-7 bg-white border-2 border-slate-200 rounded-full flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 transition-all z-20 shadow-sm"
                >
                  {node.isExpanded ? (
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" /></svg>
                  ) : (
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
                  )}
                </button>
              )}
            </div>
          </div>

          {/* 子ノードの描画 (PDF出力時はすべて強制展開) */}
          {(node.isExpanded || isExportingPDF) && node.children.length > 0 && (
            <ul>
              {node.children.map(child => (
                <OrgNode 
                  key={child.id} 
                  node={child} 
                  level={level + 1}
                  onAddChild={onAddChild}
                  onAddSibling={onAddSibling}
                  onUpdate={onUpdate}
                  onDelete={onDelete}
                  onToggle={onToggle}
                  isExportingPDF={isExportingPDF}
                />
              ))}
            </ul>
          )}
        </li>
      );
    };

    function App() {
      const [data, setData] = useState(initialData); 
      const [toastMessage, setToastMessage] = useState('');
      const [isExportingPDF, setIsExportingPDF] = useState(false);
      
      const [activeTab, setActiveTab] = useState('tree');
      
      // レイアウト方向のState
      const isInitialDataLP = initialData[0]?.children?.some(c => c.path && c.path.startsWith('#'));
      const [layoutDirection, setLayoutDirection] = useState(isInitialDataLP ? 'vertical' : 'horizontal');

      const [isNamingModalOpen, setIsNamingModalOpen] = useState(false);
      const [pdfFileName, setPdfFileName] = useState('サイトマップ_ディレクトリマップ');

      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);

      const fileInputRef = useRef(null);
      const containerRef = useRef(null);

      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0, scrollLeft: 0, scrollTop: 0 });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [data, isExportingPDF, isNamingModalOpen, activeTab, isTemplateModalOpen, layoutDirection]);

      const showToast = (msg) => {
        setToastMessage(msg);
      };

      // 編集系処理
      const updateNode = (nodes, id, newData) => {
        return nodes.map(node => {
          if (node.id === id) return { ...node, ...newData };
          if (node.children) return { ...node, children: updateNode(node.children, id, newData) };
          return node;
        });
      };

      // 子ノードとして末尾に追加
      const addChildNode = (nodes, parentId, newNode) => {
        return nodes.map(node => {
          if (node.id === parentId) {
            return { ...node, isExpanded: true, children: [...node.children, newNode] };
          }
          if (node.children && node.children.length > 0) {
            return { ...node, children: addChildNode(node.children, parentId, newNode) };
          }
          return node;
        });
      };

      // 兄弟ノードとして左または右に追加
      const addSiblingNode = (nodes, targetId, newNode, direction) => {
        const index = nodes.findIndex(n => n.id === targetId);
        if (index !== -1) {
          const newNodes = [...nodes];
          if (direction === 'left') {
            newNodes.splice(index, 0, newNode);
          } else {
            newNodes.splice(index + 1, 0, newNode);
          }
          return newNodes;
        }

        return nodes.map(node => {
          if (node.children && node.children.length > 0) {
            return { ...node, children: addSiblingNode(node.children, targetId, newNode, direction) };
          }
          return node;
        });
      };

      const deleteNode = (nodes, id) => {
        return nodes.filter(node => node.id !== id).map(node => {
          if (node.children) return { ...node, children: deleteNode(node.children, id) };
          return node;
        });
      };

      const toggleNode = (nodes, id) => {
        return nodes.map(node => {
          if (node.id === id) return { ...node, isExpanded: !node.isExpanded };
          if (node.children) return { ...node, children: toggleNode(node.children, id) };
          return node;
        });
      };

      const expandAll = (nodes, expand) => {
        return nodes.map(node => ({
          ...node,
          isExpanded: expand,
          children: node.children ? expandAll(node.children, expand) : []
        }));
      };

      const handleAddChild = (parentId) => {
        const isLP = layoutDirection === 'vertical';
        const newNode = {
          id: generateId(),
          title: isLP ? '新規セクション' : '新規ページ',
          path: isLP ? '#section' : '/new-page',
          color: isLP ? 'greige' : 'green',
          isExpanded: true,
          isHeaderMenu: isLP ? true : false, 
          children: []
        };
        setData(addChildNode(data, parentId, newNode));
      };

      const handleAddSibling = (targetId, direction) => {
        const isLP = layoutDirection === 'vertical';
        const newNode = {
          id: generateId(),
          title: isLP ? '新規セクション' : '新規ページ',
          path: isLP ? '#section' : '/new-page',
          color: isLP ? 'greige' : 'green',
          isExpanded: true,
          isHeaderMenu: isLP ? true : false,
          children: []
        };
        setData(addSiblingNode(data, targetId, newNode, direction));
      };

      const handleUpdate = (id, newData) => setData(updateNode(data, id, newData));
      const handleDelete = (id) => {
        setData(deleteNode(data, id));
        showToast('ページを削除しました');
      };
      const handleToggle = (id) => setData(toggleNode(data, id));
      const handleExpandAll = () => setData(expandAll(data, true));
      const handleCollapseAll = () => setData(expandAll(data, false));

      const handleLoadTemplate = (type) => {
        if (type === 'multi') {
          setData(multiPageTemplate);
          setLayoutDirection('horizontal'); 
          showToast('標準ウェブサイト構成に切り替えました');
        } else {
          setData(singlePageTemplate);
          setLayoutDirection('vertical'); 
          showToast('シングルページ(LP)構成に切り替えました');
        }
        setIsTemplateModalOpen(false);
      };

      // マウス＆タッチ（iPad用）共通移動処理
      const handleStart = (clientX, clientY) => {
        setIsDragging(true);
        setDragStart({
          x: clientX - containerRef.current.offsetLeft,
          y: clientY - containerRef.current.offsetTop,
          scrollLeft: containerRef.current.scrollLeft,
          scrollTop: containerRef.current.scrollTop
        });
      };

      const handleMove = (clientX, clientY) => {
        if (!isDragging) return;
        const x = clientX - containerRef.current.offsetLeft;
        const y = clientY - containerRef.current.offsetTop;
        const walkX = (x - dragStart.x) * 1.5;
        const walkY = (y - dragStart.y) * 1.5;
        containerRef.current.scrollLeft = dragStart.scrollLeft - walkX;
        containerRef.current.scrollTop = dragStart.scrollTop - walkY;
      };

      const handleMouseDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.node-card')) return;
        handleStart(e.pageX, e.pageY);
      };
      const handleMouseMove = (e) => {
        handleMove(e.pageX, e.pageY);
      };

      const handleTouchStart = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.node-card')) return;
        const touch = e.touches[0];
        handleStart(touch.pageX, touch.pageY);
      };
      const handleTouchMove = (e) => {
        const touch = e.touches[0];
        handleMove(touch.pageX, touch.pageY);
      };

      const handleEnd = () => setIsDragging(false);

      const handleExportHtml = () => {
        const currentDataString = JSON.stringify(data, null, 2);
        let baseSource = document.documentElement.outerHTML;
        const regex = /const\s+initialData\s*=\s*\[[\s\S]*?\];/g;
        const newSource = baseSource.replace(regex, `const initialData = ${currentDataString};`);

        const blob = new Blob(["<!DOCTYPE html>\n" + newSource], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sitemap_builder.html'; 
        a.click();
        URL.revokeObjectURL(url);
        showToast('編集データ入りのHTMLファイルをダウンロードしました！');
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target.result;
          try {
            if (file.name.endsWith('.html') || content.trim().startsWith('<')) {
              const regex = /const\s+initialData\s*=\s*(\[[\s\S]*?\]);/m;
              const match = content.match(regex);
              if (match && match[1]) {
                const parsedData = JSON.parse(match[1]);
                setData(parsedData);
                const isLP = parsedData[0]?.children?.some(c => c.path && c.path.startsWith('#'));
                setLayoutDirection(isLP ? 'vertical' : 'horizontal');
                showToast('保存されたHTMLからデータを復元しました！');
              } else {
                throw new Error('HTML内のデータブロックが見つかりませんでした');
              }
            } else {
              const json = JSON.parse(content);
              if (Array.isArray(json) && json.length > 0 && json[0].id) {
                setData(json);
                const isLP = json[0]?.children?.some(c => c.path && c.path.startsWith('#'));
                setLayoutDirection(isLP ? 'vertical' : 'horizontal');
                showToast('JSONデータを読み込みました');
              } else {
                throw new Error('無効なデータ形式です');
              }
            }
          } catch (err) {
            console.error(err);
            alert("有効なサイトマップデータ（HTMLまたはJSON）を検出できませんでした。");
          }
          if (fileInputRef.current) fileInputRef.current.value = '';
        };
        reader.readAsText(file);
      };

      const handleCopyText = () => {
        const generateText = (nodes, depth = 0) => {
          let text = '';
          const indent = '    '.repeat(depth);
          nodes.forEach(node => {
            let label = node.title;
            if (node.isHeaderMenu) {
              label = `[🧭Gナビ掲載] ` + label;
            }
            text += `${indent}- ${label} (${node.path})\n`;
            if (node.children && node.children.length > 0) {
              text += generateText(node.children, depth + 1);
            }
          });
          return text;
        };
        
        const text = generateText(data);
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('クリップボードにコピーしました');
        } catch (err) {
          alert("コピーに失敗しました。");
        }
        document.body.removeChild(textArea);
      };

      const executePDFGeneration = async (fileNameToUse) => {
        setIsExportingPDF(true);
        showToast('PDFを作成しています。数秒お待ちください...');

        setTimeout(async () => {
          const element = document.getElementById('pdf-content-capture');
          if (!element) {
            setIsExportingPDF(false);
            return;
          }

          const width = element.scrollWidth;
          const height = element.scrollHeight;

          try {
            const canvas = await window.html2canvas(element, {
              scale: 2,
              useCORS: true,
              width: width,
              height: height,
              windowWidth: width,
              windowHeight: height,
              backgroundColor: '#ffffff'
            });

            const imgData = canvas.toDataURL('image/png');

            const isVerticalMode = layoutDirection === 'vertical';
            const pdf = new window.jspdf.jsPDF({
              orientation: isVerticalMode ? 'portrait' : 'landscape',
              unit: 'mm',
              format: 'a4'
            });

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const margin = 10;
            const maxImgWidth = pdfWidth - margin * 2;
            const maxImgHeight = pdfHeight - margin * 2;

            const imgRatio = canvas.width / canvas.height;
            const maxRatio = maxImgWidth / maxImgHeight;

            let finalWidth = maxImgWidth;
            let finalHeight = maxImgHeight;

            if (imgRatio > maxRatio) {
              finalHeight = maxImgWidth / imgRatio;
            } else {
              finalWidth = maxImgHeight * imgRatio;
            }

            const xOffset = margin + (maxImgWidth - finalWidth) / 2;
            const yOffset = margin + (maxImgHeight - finalHeight) / 2;

            pdf.addImage(imgData, 'PNG', xOffset, yOffset, finalWidth, finalHeight);
            
            const safeName = (fileNameToUse || 'sitemap_and_directory').trim();
            pdf.save(`${safeName}.pdf`);
            
          } catch (e) {
            console.error("PDF生成エラー:", e);
            alert('キャプチャ処理中にエラーが発生しました。');
          } finally {
            setIsExportingPDF(false);
          }
        }, 1000);
      };

      const handleOpenNamingModal = () => {
        setIsNamingModalOpen(true);
      };

      const handleConfirmPDF = (e) => {
        e.preventDefault();
        setIsNamingModalOpen(false);
        executePDFGeneration(pdfFileName);
      };

      if (isExportingPDF) {
        return (
          <div className="min-h-screen w-full bg-slate-50 flex flex-col items-center justify-center font-sans">
            <style dangerouslySetInnerHTML={{__html: customCSS}} />
            <div className="flex flex-col items-center gap-6 p-8 bg-white rounded-2xl shadow-xl border border-indigo-100">

              <div className="text-center">
                <h2 className="text-xl font-bold text-slate-800 mb-2">PDFを作成しています...</h2>
                <p className="text-sm text-slate-500">全体を一枚の画像として処理し、A4サイズに縮小フィットさせています。<br/>そのまま数秒お待ちください。</p>
              </div>
            </div>

            {/* 裏側の撮影用DOM */}
            <div className="fixed top-0 left-0 pointer-events-none" style={{ zIndex: -1 }}>
              <div id="pdf-content-capture" className="bg-white font-sans text-slate-800" style={{ width: 'max-content', minWidth: '1200px', padding: '60px' }}>
                <h1 className="text-3xl font-bold text-center mb-16 text-slate-800">サイトマップ & ディレクトリマップ</h1>
                <div className="flex justify-center mb-24 w-full">
                  <div className={layoutDirection === 'vertical' ? 'vertical-tree' : 'org-tree'}>
                    <ul>
                      {data.map(node => (
                        <OrgNode

                          node={node}

                  </div>

                <div className="w-full">
                  <DirectoryMap data={data} onShowToast={()=>{}} isExportingPDF={true} />
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="h-screen flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900 overflow-hidden">
          <style dangerouslySetInnerHTML={{__html: customCSS}} />

          {/* ヘッダー */}
          <header className="bg-white border-b border-slate-200 z-30 shadow-sm flex-shrink-0">

              {/* 左側：ロゴ、タイトル、構成選択 */}

                <h1 className="text-base sm:text-lg font-bold tracking-tight hidden md:inline shrink-0">サイトマップビルダー</h1>
                
                <button
                  onClick={() => setIsTemplateModalOpen(true)}
                  className="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl transition-all"
                  title="標準複数ページ or シングルLP構成を選択"
                >
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a6.72 6.72 0 010 .252c-.008.379.137.751.43.992l1.003.828a1.125 1.125 0 01.26 1.43l-1.296 2.247a1.125 1.125 0 01-1.37.491l-1.216-.456c-.356-.133-.751-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.57 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.252c.007-.379-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.645-.869l.213-1.28z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  <span>構成選択</span>
                </button>
              </div>

              {/* 中央：表示画面切り替えタブ */}
              <div className="flex bg-slate-100 p-1 rounded-xl shadow-inner border border-slate-200">
                <button
                  onClick={() => setActiveTab('tree')}
                  className={`flex items-center gap-2 px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-lg transition-all ${
                    activeTab === 'tree'
                      ? 'bg-white text-indigo-600 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 111.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94-3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z" /></svg>
                  <span>ツリー図</span>
                </button>
                <button
                  onClick={() => setActiveTab('table')}
                  className={`flex items-center gap-2 px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-lg transition-all ${
                    activeTab === 'table'
                      ? 'bg-white text-indigo-600 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 5.25h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5" /></svg>
                  <span>ディレクトリマップ</span>
                </button>
              </div>
              
              {/* 右側：操作ボタン */}
              <div className="flex items-center gap-1 sm:gap-2">
                {activeTab === 'tree' && (
                  <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl mr-1 border border-slate-200">
                    <button 
                      onClick={() => setLayoutDirection('horizontal')} 
                      className={`px-2 py-1.5 text-xs font-bold rounded-lg transition-all flex items-center gap-1 ${
                        layoutDirection === 'horizontal' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                      }`}
                      title="ツリーを横並びにします"
                    >
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                      <span className="hidden lg:inline">横並び</span>
                    </button>
                    <button 
                      onClick={() => setLayoutDirection('vertical')} 
                      className={`px-2 py-1.5 text-xs font-bold rounded-lg transition-all flex items-center gap-1 ${
                        layoutDirection === 'vertical' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                      }`}
                      title="ツリーを縦並びにします"
                    >
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" /></svg>
                      <span className="hidden lg:inline">縦並び</span>

                <button onClick={handleCopyText} className="flex items-center gap-1 px-2 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="テキストコピー">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376A8.965 8.965 0 0012 12.75a8.965 8.965 0 00-3.75 4.625M18 7.875V11.25m0-3.375a1.125 1.125 0 011.125-1.125h1.5a1.125 1.125 0 011.125 1.125v2.25m-3.75-2.25h1.5M12 3v3.375m0-3.375a1.125 1.125 0 011.125-1.125h1.5A1.125 1.125 0 0115.75 3v2.25m-3.75-2.25h1.5" /></svg>
                  <span className="hidden sm:inline ml-1">コピー</span>
                </button>

                <button onClick={handleOpenNamingModal} className="flex items-center gap-1 px-2.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="PDF保存">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6.72 13.844l-.324.324a1.5 1.5 0 01-2.122 0l-1.25-1.25a1.5 1.5 0 010-2.122l.324-.324m10.09 10.091l-.324.324a1.5 1.5 0 01-2.122 0l-1.25-1.25a1.5 1.5 0 010-2.122l.324-.324m10.09-10.091l.324-.324a1.5 1.5 0 012.122 0l1.25 1.25a1.5 1.5 0 010 2.122l-.324.324m-10.09-10.09l.324-.324a1.5 1.5 0 012.122 0l1.25 1.25a1.5 1.5 0 010 2.122l-.324.324" /></svg>
                  <span className="hidden sm:inline ml-1">PDF</span>
                </button>

                <div className="h-6 w-px bg-slate-200 hidden sm:block"></div>

                {/* インポート（読込） */}
                <input type="file" accept=".html,.json" className="hidden" ref={fileInputRef} onChange={handleImportFile} />
                <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-1 px-2.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="ファイル読込">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                  <span className="hidden sm:inline ml-1">読込</span>
                </button>
                
                {/* HTMLとして保存するボタン */}
                <button onClick={handleExportHtml} className="flex items-center gap-1 px-3 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm" title="HTMLファイルとして保存">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                  <span className="hidden sm:inline ml-1 font-bold">HTML保存</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 flex flex-col relative overflow-hidden bg-slate-100/50">
            
            {/* 1. ツリー図キャンバス */}
            <div className={`flex-1 relative overflow-hidden ${activeTab === 'tree' ? 'block' : 'hidden'}`}>
              <div 
                ref={containerRef}
                onMouseDown={handleMouseDown}
                onMouseLeave={handleEnd}
                onMouseUp={handleEnd}
                onMouseMove={handleMouseMove}
                onTouchStart={handleTouchStart}
                onTouchEnd={handleEnd}
                onTouchMove={handleTouchMove}
                className={`w-full h-full absolute inset-0 overflow-auto ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                style={{
                  backgroundImage: 'radial-gradient(#94a3b8 1.5px, transparent 1.5px)',

                  backgroundColor: '#f8fafc'
                }}
              >
                <div className="min-w-max p-16 pb-32 pt-20">
                  <div className={layoutDirection === 'vertical' ? 'vertical-tree' : 'org-tree'}>
                    <ul>
                      {data.map(node => (
                        <OrgNode 
                          key={node.id} 
                          node={node} 
                          onAddChild={handleAddChild}
                          onAddSibling={handleAddSibling}
                          onUpdate={handleUpdate}

                        />
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>

            {/* 2. ディレクトリマップ表 */}
            <div className={`flex-1 overflow-auto bg-white ${activeTab === 'table' ? 'block' : 'hidden'}`}>
              <DirectoryMap data={data} onShowToast={showToast} isExportingPDF={false} />
            </div>

          </main>

          {/* テンプレート構成の切り替えモーダル */}
          {isTemplateModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div 
                className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-lg w-full p-6 animate-fade-in-up"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 mb-6 text-slate-800">
                  <div className="bg-indigo-50 p-2.5 rounded-xl text-indigo-600">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  </div>
                  <div>
                    <h3 className="font-bold text-lg">構成タイプの切り替え</h3>
                    <p className="text-xs text-slate-500">本日の打ち合わせに合った初期テンプレートを選択してください</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                  {/* 1. 複数ページウェブサイト */}
                  <button
                    type="button"
                    onClick={() => handleLoadTemplate('multi')}
                    className="flex flex-col items-center text-center p-5 border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/20 rounded-2xl transition-all group"
                  >
                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                    </div>
                    <span className="font-bold text-slate-800 text-sm mb-1">標準ウェブサイト構成</span>
                    <span className="text-slate-400 text-[11px] leading-relaxed">複数ページ、下層構造を持つ一般的なコーポレートサイト等の構成</span>
                  </button>

                  {/* 2. シングルページ（LP） */}
                  <button
                    type="button"
                    onClick={() => handleLoadTemplate('single')}
                    className="flex flex-col items-center text-center p-5 border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/20 rounded-2xl transition-all group"
                  >
                    <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    </div>
                    <span className="font-bold text-slate-800 text-sm mb-1">シングルページ / LP構成</span>
                    <span className="text-slate-400 text-[11px] leading-relaxed">1枚ものの縦長の構成で、ページ内セクションを定義する構成（縦型表示推奨）</span>
                  </button>
                </div>

                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 mb-6 flex gap-3 text-amber-900 text-xs">
                  <svg className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  <div>
                    <span className="font-bold block mb-0.5">注意点</span>
                    テンプレートを切り替えると、現在作成中のサイトマップ構成は上書きされて失われます。必要であれば切り替え前に右上の「保存」ボタンでファイルをバックアップしてください。
                  </div>
                </div>

                <div className="flex justify-end">
                  <button 
                    type="button"
                    onClick={() => setIsTemplateModalOpen(false)}
                    className="px-5 py-2 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 transition-colors"
                  >
                    キャンセル
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ファイル名入力用のカスタムモーダル */}
          {isNamingModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form 
                onSubmit={handleConfirmPDF}
                className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full p-6 animate-fade-in-up"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 mb-4 text-slate-800">
                  <div className="bg-indigo-50 p-2.5 rounded-xl text-indigo-600">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" /><path strokeLinecap="round" strokeLinejoin="round" d="M14.25 9.75l-4.5 1.5 1.5 4.5 4.5-1.5-1.5-4.5z" /></svg>
                  </div>
                  <div>
                    <h3 className="font-bold text-lg">PDFをダウンロード</h3>
                    <p className="text-xs text-slate-500">保存するファイルの名前を指定してください</p>
                  </div>
                </div>
                
                <div className="mb-6">
                  <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">ファイル名</label>
                  <div className="relative flex items-center">
                    <input 
                      type="text" 
                      required
                      autoFocus
                      value={pdfFileName}
                      onChange={e => setPdfFileName(e.target.value)}
                      placeholder="sitemap_and_directory"
                      className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm font-medium text-slate-800 pr-12 transition-all"
                    />
                    <span className="absolute right-4 text-xs font-semibold text-slate-400">.pdf</span>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button 
                    type="button"
                    onClick={() => setIsNamingModalOpen(false)}
                    className="flex-1 py-3 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    type="submit"
                    className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md shadow-indigo-100 transition-colors"
                  >
                    保存する
                  </button>
                </div>
              </form>
            </div>
          )}

          <Toast message={toastMessage} onClose={() => setToastMessage('')} />
        </div>
      );
    }

    const customCSS = `
      /* --- 横並び（組織図型）のスタイル定義 --- */
      .org-tree { display: flex; justify-content: center; }
      .org-tree ul { padding-top: 24px; position: relative; display: flex; justify-content: center; padding-left: 0; margin: 0; }
      .org-tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 24px 12px 0 12px; }
      
      .org-tree li::before, .org-tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #cbd5e1; width: 50%; height: 24px; }
      .org-tree li::after { right: auto; left: 50%; border-left: 2px solid #cbd5e1; }
      
      .org-tree li:only-child::after, .org-tree li:only-child::before { display: none; }
      .org-tree li:only-child { padding-top: 0; }
      
      .org-tree li:first-child::before, .org-tree li:last-child::after { border: 0 none; }
      .org-tree li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 6px 0 0; }
      .org-tree li:first-child::after { border-radius: 6px 0 0 0; }
      
      .org-tree ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #cbd5e1; width: 0; height: 24px; transform: translateX(-50%); }
      
      .org-tree > ul { padding-top: 0; }
      .org-tree > ul::before { display: none; }

      /* --- ★ 縦並び（LP縦フロー型）のスタイル定義 --- */
      .vertical-tree { display: flex; flex-direction: column; align-items: center; }
      .vertical-tree ul { padding-top: 36px; position: relative; display: flex; flex-direction: column; align-items: center; padding-left: 0; margin: 0; }
      .vertical-tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 0 0 36px 0; width: 100%; }
      
      /* 親から下に伸びる中央線 */
      .vertical-tree ul::before { 
        content: ''; 
        position: absolute; 
        top: 0; 
        left: 50%; 
        border-left: 2px solid #cbd5e1; 
        width: 0; 
        height: 36px; 
        transform: translateX(-50%); 
      }
      
      /* 子要素同士を繋ぐ縦線 */
      .vertical-tree li::before { 
        content: ''; 
        position: absolute; 
        bottom: 0; 
        left: 50%; 
        border-left: 2px solid #cbd5e1; 
        width: 0; 
        height: 36px; 
        transform: translateX(-50%); 
        display: block !important;
        border-top: none !important;
        border-radius: 0 !important;
      }
      
      /* 最後の要素の下の線は不要 */
      .vertical-tree li:last-child::before { display: none !important; }
      
      .vertical-tree li::after { display: none !important; }
    `;

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
