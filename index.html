<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイトマップビルダー (iPad対応版)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for in-browser JSX parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- PDF Export Libraries (事前読み込み) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin></script>

  <style>
    /* iOSでの長押し選択やスクロールのバウンスなどを制御するスタイル */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // カラーパレットの定義
    const NODE_COLORS = [
      { id: 'white', name: 'ホワイト', bg: 'bg-white', border: 'border-slate-200', text: 'text-slate-800', pathText: 'text-slate-500', pathBg: 'bg-slate-100', inputBg: 'bg-slate-50', actionBtn: 'text-slate-400 hover:text-indigo-600 hover:bg-indigo-50', deleteBtn: 'text-slate-400 hover:text-red-600 hover:bg-red-50' },
      { id: 'lightgrey', name: 'ライトグレー', bg: 'bg-slate-100', border: 'border-slate-300', text: 'text-slate-800', pathText: 'text-slate-500', pathBg: 'bg-slate-200/60', inputBg: 'bg-slate-50', actionBtn: 'text-slate-500 hover:text-indigo-600 hover:bg-indigo-50', deleteBtn: 'text-slate-500 hover:text-red-600 hover:bg-red-50' },
      { id: 'darkgrey', name: 'ダークグレー', bg: 'bg-[#555a64]', border: 'border-[#3f434a]', text: 'text-white', pathText: 'text-slate-200', pathBg: 'bg-[#3f434a]/60', inputBg: 'bg-[#6c727d]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-300 hover:bg-red-900/50' },
      { id: 'greige', name: 'グレージュ', bg: 'bg-[#E5E0DB]', border: 'border-[#c8bfa7]', text: 'text-[#4a3f35]', pathText: 'text-[#6e5d4f]', pathBg: 'bg-[#f0ece9]', inputBg: 'bg-[#f5f2f0]', actionBtn: 'text-[#6e5d4f] hover:text-indigo-600 hover:bg-indigo-50', deleteBtn: 'text-[#6e5d4f] hover:text-red-600 hover:bg-red-50' },
      { id: 'olive', name: 'アース(オリーブ)', bg: 'bg-[#7D846C]', border: 'border-[#626853]', text: 'text-white', pathText: 'text-[#d2d6c9]', pathBg: 'bg-[#5d624e]', inputBg: 'bg-[#8f967d]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'terracotta', name: 'アース(テラコッタ)', bg: 'bg-[#C17A61]', border: 'border-[#9c5942]', text: 'text-white', pathText: 'text-[#f2ded6]', pathBg: 'bg-[#9c5942]', inputBg: 'bg-[#d2957e]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'yellow', name: 'イエロー', bg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-900', pathText: 'text-amber-700', pathBg: 'bg-amber-200/60', inputBg: 'bg-amber-50', actionBtn: 'text-amber-600 hover:text-amber-800 hover:bg-amber-200/50', deleteBtn: 'text-amber-600 hover:text-red-600 hover:bg-red-100' },
      { id: 'mint', name: 'ミント', bg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-900', pathText: 'text-emerald-700', pathBg: 'bg-emerald-200/60', inputBg: 'bg-emerald-50', actionBtn: 'text-emerald-600 hover:text-emerald-800 hover:bg-emerald-200/50', deleteBtn: 'text-emerald-600 hover:text-red-600 hover:bg-red-100' },
      { id: 'sky', name: 'スカイ', bg: 'bg-sky-100', border: 'border-sky-300', text: 'text-sky-900', pathText: 'text-sky-700', pathBg: 'bg-sky-200/60', inputBg: 'bg-sky-50', actionBtn: 'text-sky-600 hover:text-sky-800 hover:bg-sky-200/50', deleteBtn: 'text-sky-600 hover:text-red-600 hover:bg-red-100' },
      { id: 'red', name: 'レッド', bg: 'bg-red-500', border: 'border-red-600', text: 'text-white', pathText: 'text-red-100', pathBg: 'bg-red-600/50', inputBg: 'bg-red-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'orange', name: 'オレンジ', bg: 'bg-orange-500', border: 'border-orange-600', text: 'text-white', pathText: 'text-orange-100', pathBg: 'bg-orange-600/50', inputBg: 'bg-orange-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'green', name: 'グリーン', bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white', pathText: 'text-emerald-100', pathBg: 'bg-emerald-600/50', inputBg: 'bg-emerald-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'teal', name: 'ティール', bg: 'bg-teal-600', border: 'border-teal-700', text: 'text-white', pathText: 'text-teal-100', pathBg: 'bg-teal-700/50', inputBg: 'bg-teal-500', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'blue', name: 'ブルー', bg: 'bg-blue-500', border: 'border-blue-600', text: 'text-white', pathText: 'text-blue-100', pathBg: 'bg-blue-600/50', inputBg: 'bg-blue-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'indigo', name: 'インディゴ', bg: 'bg-indigo-500', border: 'border-indigo-600', text: 'text-white', pathText: 'text-indigo-100', pathBg: 'bg-indigo-600/50', inputBg: 'bg-indigo-400', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'purple', name: 'パープル', bg: 'bg-purple-500', border: 'border-purple-600', text: 'text-white', pathText: 'text-purple-100', pathBg: 'bg-purple-600/50', inputBg: 'bg-[#b060f0]', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-100 hover:bg-red-800/40' },
      { id: 'slate', name: 'スレート', bg: 'bg-slate-700', border: 'border-slate-800', text: 'text-white', pathText: 'text-slate-200', pathBg: 'bg-slate-800/50', inputBg: 'bg-slate-600', actionBtn: 'text-white/70 hover:text-white hover:bg-white/20', deleteBtn: 'text-white/70 hover:text-red-300 hover:bg-red-900/50' },
    ];

    const getColorClass = (colorId) => {
      return NODE_COLORS.find(c => c.id === colorId) || NODE_COLORS[0];
    };

    // 初期データ
    const initialData = [
      {
        id: 'root-1',
        title: 'ホーム',
        path: '/',
        color: 'green',
        isExpanded: true,
        children: [
          {
            id: 'child-1',
            title: '会社概要',
            path: '/about',
            color: 'green',
            isExpanded: true,
            children: [
               { id: 'child-1-1', title: '代表挨拶', path: '/about/message', color: 'green', isExpanded: true, children: [] },
               { id: 'child-1-2', title: 'アクセス', path: '/about/access', color: 'green', isExpanded: true, children: [] }
            ]
          },
          {
            id: 'child-2',
            title: 'サービス',
            path: '/services',
            color: 'green',
            isExpanded: true,
            children: [
               { id: 'child-2-1', title: 'Webサイト制作', path: '/services/web', color: 'green', isExpanded: true, children: [] },
               { id: 'child-2-2', title: 'システム開発', path: '/services/system', color: 'green', isExpanded: true, children: [] },
               { id: 'child-2-3', title: 'マーケティング', path: '/services/marketing', color: 'green', isExpanded: true, children: [] }
            ]
          },
          {
            id: 'child-3',
            title: '採用情報',
            path: '/recruit',
            color: 'green',
            isExpanded: true,
            children: []
          },
          {
            id: 'child-4',
            title: 'お問い合わせ',
            path: '/contact',
            color: 'green',
            isExpanded: true,
            children: []
          }
        ]
      }
    ];

    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

    // トースト通知
    const Toast = ({ message, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          onClose();
        }, 3000);
        return () => clearTimeout(timer);
      }, [message, onClose]);

      if (!message) return null;

      return (
        <div className="fixed bottom-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50">
          <i data-lucide="check" className="text-green-400 w-5 h-5"></i>
          <span className="font-medium text-sm">{message}</span>
        </div>
      );
    };

    // ノード数のカウント
    const countNodes = (node) => {
      let count = 1;
      if (node.children && node.children.length > 0) {
        node.children.forEach(child => {
          count += countNodes(child);
        });
      }
      return count;
    };

    // ディレクトリマップ (Excel・PDF対応)
    const DirectoryMap = ({ data, onShowToast, isExportingPDF }) => {
      const rows = [];
      let maxLevel = 1;

      const traverse = (nodes, level) => {
        nodes.forEach(node => {
          if (level > maxLevel) maxLevel = level;
          rows.push({
            node,
            level,
            rowSpan: countNodes(node)
          });
          if (node.children && node.children.length > 0) {
            traverse(node.children, level + 1);
          }
        });
      };
      traverse(data, 1);

      const getLevelBgColor = (level) => {
        switch (level) {
          case 1: return 'bg-[#cce0ff]'; 
          case 2: return 'bg-[#e2f0d9]'; 
          case 3: return 'bg-white';     
          case 4: return 'bg-[#fff2cc]'; 
          case 5: return 'bg-[#fce4d6]'; 
          default: return 'bg-white';
        }
      };

      const handleExportExcel = () => {
        let html = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office"
                xmlns:x="urn:schemas-microsoft-com:office:excel"
                xmlns="http://www.w3.org/TR/REC-html40">
          <head>
          <meta charset="utf-8" />
          <style>
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #94a3b8; font-family: sans-serif; font-size: 13px; padding: 6px; text-align: left; vertical-align: top; }
            th { background-color: #f8fafc; font-weight: bold; text-align: center; }
            .bg-level-1 { background-color: #cce0ff; }
            .bg-level-2 { background-color: #e2f0d9; }
            .bg-level-3 { background-color: #ffffff; }
            .bg-level-4 { background-color: #fff2cc; }
            .bg-level-5 { background-color: #fce4d6; }
          </style>
          </head>
          <body>
            <table>
              <thead>
                <tr>
        `;

        for (let i = 1; i <= maxLevel; i++) {
          html += `<th style="width: 120px;">第${i}階層</th>`;
        }
        html += `<th style="width: 250px;">URL</th></tr></thead><tbody>`;

        rows.forEach(row => {
          html += `<tr>`;
          for (let l = 1; l <= maxLevel; l++) {
            let rowLevelColorClass = `bg-level-${row.level > 5 ? 3 : row.level}`;
            if (l === row.level) {
              html += `<td rowspan="${row.rowSpan}" class="${rowLevelColorClass}" style="font-weight: bold;">${row.node.title}</td>`;
            } else if (l > row.level) {
              html += `<td class="${rowLevelColorClass}"></td>`;
            }
          }
          html += `<td class="bg-level-${row.level > 5 ? 3 : row.level}" style="font-family: monospace;">${row.node.path}</td></tr>`;
        });

        html += `</tbody></table></body></html>`;

        const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'directory_map.xls';
        a.click();
        URL.revokeObjectURL(url);
        if(onShowToast) onShowToast('Excelファイル(.xls)をダウンロードしました');
      };

      return (
        <div className={`p-4 sm:p-6 lg:p-8 ${isExportingPDF ? 'w-full px-0 py-0 max-w-none' : 'max-w-7xl mx-auto'}`}>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
            <div className="flex items-center gap-2 text-slate-800">
              <i data-lucide="table-properties" className="text-indigo-600 w-5 h-5"></i>
              <h2 className="text-lg font-bold tracking-tight">ディレクトリマップ (ページ一覧)</h2>
            </div>
            {!isExportingPDF && (
              <button 
                onClick={handleExportExcel}
                className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-green-700 bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg transition-colors w-fit shadow-sm"
              >
                <i data-lucide="file-spreadsheet" className="w-4 h-4"></i>
                <span>Excel出力</span>
              </button>
            )}
          </div>
          <div className={`${isExportingPDF ? 'w-full border-none shadow-none' : 'overflow-x-auto border border-slate-400 shadow-sm'}`}>
            <table className={`text-sm text-left border-collapse bg-white ${isExportingPDF ? 'w-full mx-auto border border-slate-400' : 'w-full'}`}>
              <thead className={`text-sm text-slate-700 bg-slate-50 ${isExportingPDF ? '' : 'sticky top-0 z-10'}`}>
                <tr>
                  {Array.from({ length: maxLevel }).map((_, i) => (
                    <th key={i} className="px-4 py-2.5 font-bold border border-slate-400 text-center whitespace-nowrap min-w-[120px]">
                      第{i + 1}階層
                    </th>
                  ))}
                  <th className="px-4 py-2.5 font-bold border border-slate-400 text-center whitespace-nowrap min-w-[200px]">
                    URL
                  </th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row) => {
                  const tds = [];
                  for (let l = 1; l <= maxLevel; l++) {
                    if (l === row.level) {
                      tds.push(
                        <td 
                          key={l} 
                          rowSpan={row.rowSpan} 
                          className={`px-4 py-2.5 border border-slate-400 align-top ${getLevelBgColor(l)} font-bold text-slate-800`}
                        >
                          {row.node.title}
                        </td>
                      );
                    } else if (l > row.level) {
                      tds.push(
                        <td 
                          key={l} 
                          className={`px-4 py-2.5 border border-slate-400 ${getLevelBgColor(row.level)}`}
                        ></td>
                      );
                    }
                  }
                  return (
                    <tr key={row.node.id}>
                      {tds}
                      <td className={`px-4 py-2.5 border border-slate-400 font-mono text-[13px] text-slate-700 ${getLevelBgColor(row.level)}`}>
                        {row.node.path}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // サイトマップツリーの個別ノード
    const OrgNode = ({ node, onAdd, onUpdate, onDelete, onToggle, level = 0, isExportingPDF }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [editTitle, setEditTitle] = useState(node.title);
      const [editPath, setEditPath] = useState(node.path);
      const [editColor, setEditColor] = useState(node.color || 'green');
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

      useEffect(() => {
        if (isEditing) {
          setEditTitle(node.title);
          setEditPath(node.path);
          setEditColor(node.color || 'green');
        }
      }, [isEditing, node.title, node.path, node.color]);

      // Lucideアイコンの再適用
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [isEditing, showDeleteConfirm]);

      const handleSave = (e) => {
        e?.stopPropagation();
        if (!editTitle.trim()) return;
        onUpdate(node.id, { title: editTitle, path: editPath, color: editColor });
        setIsEditing(false);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') handleSave(e);
        if (e.key === 'Escape') {
          e.stopPropagation();
          setIsEditing(false);
        }
      };

      const isRoot = level === 0;
      const currentStyle = getColorClass(node.color || 'green');

      return (
        <li>
          <div className="relative inline-flex flex-col items-center group node-card">
            {/* カード本体 */}
            <div className={`border-2 rounded-xl pt-5 pb-4 px-2 w-[190px] relative transition-all duration-300 shadow-sm hover:shadow-md
              ${currentStyle.bg}
              ${isEditing || showDeleteConfirm ? 'ring-4 ring-indigo-100 border-indigo-400 z-10' : `${currentStyle.border} hover:border-indigo-300`}`}>
              
              {/* 各種アクションボタン (iPadでのタップ操作にも完全配慮) */}
              {!isEditing && !showDeleteConfirm && !isExportingPDF && (
                <div className="absolute top-1 right-1 flex gap-0.5 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity z-20">
                  <button 
                    onClick={(e) => { e.stopPropagation(); onAdd(node.id); }} 
                    className={`p-1.5 rounded transition-colors ${currentStyle.actionBtn}`} 
                    title="子ページを追加"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i>
                  </button>
                  {!isRoot && (
                    <button 
                      onClick={(e) => { e.stopPropagation(); setShowDeleteConfirm(true); }} 
                      className={`p-1.5 rounded transition-colors ${currentStyle.deleteBtn}`} 
                      title="削除"
                    >
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  )}
                </div>
              )}

              {/* コンテンツエリア */}
              <div className="min-h-[64px] flex flex-col justify-center">
                {showDeleteConfirm && !isExportingPDF ? (
                  <div className="flex flex-col items-center justify-center" onClick={e => e.stopPropagation()}>
                    <span className={`text-xs font-bold mb-2 ${currentStyle.text === 'text-white' ? 'text-white' : 'text-red-600'}`}>削除しますか？</span>
                    <div className="flex gap-2">
                      <button onClick={(e) => { e.stopPropagation(); onDelete(node.id); }} className="px-3 py-1.5 bg-red-600 text-white text-xs font-bold rounded-lg hover:bg-red-700 transition-colors shadow-sm">はい</button>
                      <button onClick={(e) => { e.stopPropagation(); setShowDeleteConfirm(false); }} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-colors shadow-sm ${currentStyle.text === 'text-white' ? 'bg-white/20 text-white hover:bg-white/30' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'}`}>いいえ</button>
                    </div>
                  </div>
                ) : isEditing && !isExportingPDF ? (
                  <div className="flex flex-col gap-2 px-1" onClick={e => e.stopPropagation()}>
                    {/* カラーピッカー */}
                    <div className="flex justify-center flex-wrap gap-1.5 mb-1 bg-white/90 backdrop-blur-sm p-1.5 rounded-lg border border-slate-200/50 shadow-sm w-full relative z-20">
                      {NODE_COLORS.map(c => (
                        <button
                          key={c.id}
                          onClick={(e) => { e.stopPropagation(); setEditColor(c.id); }}
                          className={`w-5 h-5 rounded-full border shadow-sm transition-all ${c.bg} ${c.border} ${editColor === c.id ? 'ring-2 ring-offset-1 ring-indigo-500 scale-110 z-10' : 'hover:scale-110'}`}
                          title={c.name}
                          type="button"
                        />
                      ))}
                    </div>
                    <input
                      autoFocus
                      value={editTitle}
                      onChange={(e) => setEditTitle(e.target.value)}
                      onKeyDown={handleKeyDown}
                      className={`w-full px-2 py-1.5 text-sm font-bold border-b border-white/30 focus:border-white focus:outline-none text-center ${currentStyle.inputBg} ${currentStyle.text} placeholder:text-current placeholder:opacity-50 rounded-t transition-colors`}
                      placeholder="タイトル"
                    />
                    <input
                      value={editPath}
                      onChange={(e) => setEditPath(e.target.value)}
                      onKeyDown={handleKeyDown}
                      className={`w-full px-2 py-1 text-xs font-mono border-b border-white/30 focus:border-white focus:outline-none text-center ${currentStyle.inputBg} ${currentStyle.text} placeholder:text-current placeholder:opacity-50 rounded-t transition-colors mt-0.5`}
                      placeholder="/path"
                    />
                    <div className="flex justify-center gap-2 mt-2">
                      <button onClick={handleSave} className="flex-1 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors shadow-sm flex justify-center items-center">
                        <i data-lucide="check" className="w-4 h-4"></i>
                      </button>
                      <button onClick={(e) => { e.stopPropagation(); setIsEditing(false); }} className={`flex-1 py-1.5 rounded-lg transition-colors shadow-sm flex justify-center items-center ${currentStyle.text === 'text-white' ? 'bg-white/20 text-white hover:bg-white/30' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'}`}>
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                ) : (
                  <div 
                    className="cursor-text text-center px-2 py-3 flex flex-col items-center w-full"
                    onClick={(e) => { if (!isExportingPDF) { e.stopPropagation(); setIsEditing(true); } }}
                  >
                    <div 
                      className={`font-bold ${currentStyle.text} text-[15px] w-full px-1 mb-1.5`}
                      style={{ lineHeight: '1.4', wordBreak: 'break-word', overflowWrap: 'break-word' }}
                    >
                      {node.title}
                    </div>
                    <div className={`inline-flex items-center justify-center ${currentStyle.pathBg} rounded-md px-3 py-1.5 max-w-[95%] border border-white/20`}>
                      <div 
                        className={`text-[11px] ${currentStyle.pathText} font-mono`}
                        style={{ lineHeight: '1.2', wordBreak: 'break-all', paddingBottom: '1px' }}
                      >
                        {node.path || '/'}
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* 開閉トグルボタン */}
              {node.children.length > 0 && !isExportingPDF && (
                <button 
                  onClick={(e) => { e.stopPropagation(); onToggle(node.id); }}
                  className="absolute -bottom-3.5 left-1/2 -translate-x-1/2 w-7 h-7 bg-white border-2 border-slate-200 rounded-full flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 transition-all z-20 shadow-sm"
                >
                  {node.isExpanded ? <i data-lucide="chevron-up" className="w-4 h-4"></i> : <i data-lucide="chevron-down" className="w-4 h-4"></i>}
                </button>
              )}
            </div>
          </div>

          {/* 子ノードの描画 (PDF出力時はすべて強制展開) */}
          {(node.isExpanded || isExportingPDF) && node.children.length > 0 && (
            <ul>
              {node.children.map(child => (
                <OrgNode 
                  key={child.id} 
                  node={child} 
                  level={level + 1}
                  onAdd={onAdd}
                  onUpdate={onUpdate}
                  onDelete={onDelete}
                  onToggle={onToggle}
                  isExportingPDF={isExportingPDF}
                />
              ))}
            </ul>
          )}
        </li>
      );
    };

    // メインアプリケーション
    function App() {
      const [data, setData] = useState(initialData);
      const [toastMessage, setToastMessage] = useState('');
      const [isExportingPDF, setIsExportingPDF] = useState(false);
      
      // タブ切り替え用のState ('tree' または 'table')
      const [activeTab, setActiveTab] = useState('tree');
      
      // PDF名を入力するためのモーダル用State
      const [isNamingModalOpen, setIsNamingModalOpen] = useState(false);
      const [pdfFileName, setPdfFileName] = useState('サイトマップ_ディレクトリマップ');

      const fileInputRef = useRef(null);
      const containerRef = useRef(null);

      // iPadを含むタッチ＆マウスドラッグ兼用スクロール用ステート
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0, scrollLeft: 0, scrollTop: 0 });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [data, isExportingPDF, isNamingModalOpen, activeTab]);

      const showToast = (msg) => {
        setToastMessage(msg);
      };

      // 編集系処理
      const updateNode = (nodes, id, newData) => {
        return nodes.map(node => {
          if (node.id === id) return { ...node, ...newData };
          if (node.children) return { ...node, children: updateNode(node.children, id, newData) };
          return node;
        });
      };

      const addNode = (nodes, parentId, newNode) => {
        return nodes.map(node => {
          if (node.id === parentId) {
            return { ...node, isExpanded: true, children: [...node.children, newNode] };
          }
          if (node.children) {
            return { ...node, children: addNode(node.children, parentId, newNode) };
          }
          return node;
        });
      };

      const deleteNode = (nodes, id) => {
        return nodes.filter(node => node.id !== id).map(node => {
          if (node.children) return { ...node, children: deleteNode(node.children, id) };
          return node;
        });
      };

      const toggleNode = (nodes, id) => {
        return nodes.map(node => {
          if (node.id === id) return { ...node, isExpanded: !node.isExpanded };
          if (node.children) return { ...node, children: toggleNode(node.children, id) };
          return node;
        });
      };

      const expandAll = (nodes, expand) => {
        return nodes.map(node => ({
          ...node,
          isExpanded: expand,
          children: node.children ? expandAll(node.children, expand) : []
        }));
      };

      const handleAdd = (parentId) => {
        const newNode = {
          id: generateId(),
          title: '新規ページ',
          path: '/new',
          color: 'green',
          isExpanded: true,
          children: []
        };
        setData(addNode(data, parentId, newNode));
      };

      const handleUpdate = (id, newData) => setData(updateNode(data, id, newData));
      const handleDelete = (id) => {
        setData(deleteNode(data, id));
        showToast('ページを削除しました');
      };
      const handleToggle = (id) => setData(toggleNode(data, id));
      const handleExpandAll = () => setData(expandAll(data, true));
      const handleCollapseAll = () => setData(expandAll(data, false));

      // マウス＆タッチ（iPad用）共通移動処理
      const handleStart = (clientX, clientY) => {
        setIsDragging(true);
        setDragStart({
          x: clientX - containerRef.current.offsetLeft,
          y: clientY - containerRef.current.offsetTop,
          scrollLeft: containerRef.current.scrollLeft,
          scrollTop: containerRef.current.scrollTop
        });
      };

      const handleMove = (clientX, clientY) => {
        if (!isDragging) return;
        const x = clientX - containerRef.current.offsetLeft;
        const y = clientY - containerRef.current.offsetTop;
        const walkX = (x - dragStart.x) * 1.5;
        const walkY = (y - dragStart.y) * 1.5;
        containerRef.current.scrollLeft = dragStart.scrollLeft - walkX;
        containerRef.current.scrollTop = dragStart.scrollTop - walkY;
      };

      // マウスイベント
      const handleMouseDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.node-card')) return;
        handleStart(e.pageX, e.pageY);
      };
      const handleMouseMove = (e) => {
        handleMove(e.pageX, e.pageY);
      };

      // iPadタッチイベント
      const handleTouchStart = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.node-card')) return;
        const touch = e.touches[0];
        handleStart(touch.pageX, touch.pageY);
      };
      const handleTouchMove = (e) => {
        const touch = e.touches[0];
        handleMove(touch.pageX, touch.pageY);
      };

      const handleEnd = () => setIsDragging(false);

      // 保存・入出力処理
      const handleExportJson = () => {
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sitemap_export.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('JSONファイルをダウンロードしました');
      };

      const handleImportJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const json = JSON.parse(event.target.result);
            if (Array.isArray(json) && json.length > 0 && json[0].id) {
              setData(json);
              showToast('データを読み込みました');
            } else {
              throw new Error('無効なデータ形式です');
            }
          } catch (err) {
            alert("有効なサイトマップJSONファイルではありません。");
          }
          if (fileInputRef.current) fileInputRef.current.value = '';
        };
        reader.readAsText(file);
      };

      const handleCopyText = () => {
        const generateText = (nodes, depth = 0) => {
          let text = '';
          const indent = '    '.repeat(depth);
          nodes.forEach(node => {
            text += `${indent}- ${node.title} (${node.path})\n`;
            if (node.children && node.children.length > 0) {
              text += generateText(node.children, depth + 1);
            }
          });
          return text;
        };
        
        const text = generateText(data);
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('クリップボードにコピーしました');
        } catch (err) {
          alert("コピーに失敗しました。");
        }
        document.body.removeChild(textArea);
      };

      // 実際のPDF出力処理
      const executePDFGeneration = async (fileNameToUse) => {
        setIsExportingPDF(true);
        showToast('PDFを作成しています。数秒お待ちください...');

        setTimeout(async () => {
          const element = document.getElementById('pdf-content-capture');
          if (!element) {
            setIsExportingPDF(false);
            return;
          }

          const width = element.scrollWidth;
          const height = element.scrollHeight;

          try {
            const canvas = await window.html2canvas(element, {
              scale: 2,
              useCORS: true,
              width: width,
              height: height,
              windowWidth: width,
              windowHeight: height,
              backgroundColor: '#ffffff'
            });

            const imgData = canvas.toDataURL('image/png');

            const pdf = new window.jspdf.jsPDF({
              orientation: 'landscape',
              unit: 'mm',
              format: 'a4'
            });

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const margin = 10;
            const maxImgWidth = pdfWidth - margin * 2;
            const maxImgHeight = pdfHeight - margin * 2;

            const imgRatio = canvas.width / canvas.height;
            const maxRatio = maxImgWidth / maxImgHeight;

            let finalWidth = maxImgWidth;
            let finalHeight = maxImgHeight;

            if (imgRatio > maxRatio) {
              finalHeight = maxImgWidth / imgRatio;
            } else {
              finalWidth = maxImgHeight * imgRatio;
            }

            const xOffset = margin + (maxImgWidth - finalWidth) / 2;
            const yOffset = margin + (maxImgHeight - finalHeight) / 2;

            pdf.addImage(imgData, 'PNG', xOffset, yOffset, finalWidth, finalHeight);
            
            // ユーザーが入力したファイル名で保存
            const safeName = (fileNameToUse || 'sitemap_and_directory').trim();
            pdf.save(`${safeName}.pdf`);
            
          } catch (e) {
            console.error("PDF生成エラー:", e);
            alert('キャプチャ処理中にエラーが発生しました。');
          } finally {
            setIsExportingPDF(false);
          }
        }, 1000);
      };

      // PDF出力用モーダルオープン
      const handleOpenNamingModal = () => {
        setIsNamingModalOpen(true);
      };

      // PDF出力確定
      const handleConfirmPDF = (e) => {
        e.preventDefault();
        setIsNamingModalOpen(false);
        executePDFGeneration(pdfFileName);
      };

      // PDF出力用ローディング画面
      if (isExportingPDF) {
        return (
          <div className="min-h-screen w-full bg-slate-50 flex flex-col items-center justify-center font-sans">
            <style dangerouslySetInnerHTML={{__html: customCSS}} />
            <div className="flex flex-col items-center gap-6 p-8 bg-white rounded-2xl shadow-xl border border-indigo-100">
              <i data-lucide="loader-2" className="text-indigo-600 animate-spin w-12 h-12"></i>
              <div className="text-center">
                <h2 className="text-xl font-bold text-slate-800 mb-2">PDFを作成しています...</h2>
                <p className="text-sm text-slate-500">全体を一枚の画像として処理し、A4サイズに縮小フィットさせています。<br/>そのまま数秒お待ちください。</p>
              </div>
            </div>

            {/* 裏側の撮影用DOM */}
            <div className="fixed top-0 left-0 pointer-events-none" style={{ zIndex: -1 }}>
              <div id="pdf-content-capture" className="bg-white font-sans text-slate-800" style={{ width: 'max-content', minWidth: '1200px', padding: '60px' }}>
                <h1 className="text-3xl font-bold text-center mb-16 text-slate-800">サイトマップ & ディレクトリマップ</h1>
                <div className="flex justify-center mb-24 w-full">
                  <div className="org-tree">
                    <ul>
                      {data.map(node => (
                        <OrgNode 
                          key={node.id} 
                          node={node} 
                          onAdd={()=>{}} onUpdate={()=>{}} onDelete={()=>{}} onToggle={()=>{}} 
                          isExportingPDF={true} 
                        />
                      ))}
                    </ul>
                  </div>
                </div>
                <div className="w-full">
                  <DirectoryMap data={data} onShowToast={()=>{}} isExportingPDF={true} />
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="h-screen flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900 overflow-hidden">
          <style dangerouslySetInnerHTML={{__html: customCSS}} />

          {/* ヘッダー */}
          <header className="bg-white border-b border-slate-200 z-30 shadow-sm flex-shrink-0">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              {/* 左側：ロゴ & タイトル */}
              <div className="flex items-center gap-2 text-indigo-600">
                <i data-lucide="layout-template" className="w-6 h-6"></i>
                <h1 className="text-base sm:text-lg font-bold tracking-tight hidden md:inline">サイトマップビルダー</h1>
              </div>

              {/* ★ 中央：表示画面切り替えタブ（上下分割を廃止し、タブ式で全画面化） */}
              <div className="flex bg-slate-100 p-1 rounded-xl shadow-inner border border-slate-200">
                <button
                  onClick={() => setActiveTab('tree')}
                  className={`flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all ${
                    activeTab === 'tree'
                      ? 'bg-white text-indigo-600 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i data-lucide="network" className="w-4 h-4"></i>
                  <span>ツリー図</span>
                </button>
                <button
                  onClick={() => setActiveTab('table')}
                  className={`flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all ${
                    activeTab === 'table'
                      ? 'bg-white text-indigo-600 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i data-lucide="table-properties" className="w-4 h-4"></i>
                  <span>ディレクトリマップ</span>
                </button>
              </div>
              
              {/* 右側：操作ボタン */}
              <div className="flex items-center gap-1.5 sm:gap-2">
                {activeTab === 'tree' && (
                  <div className="hidden lg:flex items-center bg-slate-100 p-1 rounded-lg mr-2">
                    <button onClick={handleExpandAll} className="px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-white hover:shadow-sm rounded transition-all">全て展開</button>
                    <button onClick={handleCollapseAll} className="px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-white hover:shadow-sm rounded transition-all">折り畳む</button>
                  </div>
                )}

                <button onClick={handleCopyText} className="flex items-center gap-1 px-2.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="テキストコピー">
                  <i data-lucide="copy" className="w-4 h-4"></i>
                  <span className="hidden xl:inline ml-1">コピー</span>
                </button>

                <button onClick={handleOpenNamingModal} className="flex items-center gap-1 px-2.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="PDF保存">
                  <i data-lucide="printer" className="w-4 h-4"></i>
                  <span className="hidden xl:inline ml-1">PDF</span>
                </button>

                <div className="h-6 w-px bg-slate-200"></div>

                <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleImportJson} />
                <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-1 px-2.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="インポート">
                  <i data-lucide="upload" className="w-4 h-4"></i>
                  <span className="hidden xl:inline ml-1">読込</span>
                </button>
                <button onClick={handleExportJson} className="flex items-center gap-1 px-3 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm" title="JSON保存">
                  <i data-lucide="download" className="w-4 h-4"></i>
                  <span className="hidden xl:inline ml-1">保存</span>
                </button>
              </div>
            </div>
          </header>

          {/* メイン表示エリア (タブで切り替わり、それぞれ画面幅一杯で使用) */}
          <main className="flex-1 flex flex-col relative overflow-hidden bg-slate-100/50">
            
            {/* 1. ツリー図キャンバス */}
            <div className={`flex-1 relative overflow-hidden ${activeTab === 'tree' ? 'block' : 'hidden'}`}>
              <div 
                ref={containerRef}
                onMouseDown={handleMouseDown}
                onMouseLeave={handleEnd}
                onMouseUp={handleEnd}
                onMouseMove={handleMouseMove}
                onTouchStart={handleTouchStart}
                onTouchEnd={handleEnd}
                onTouchMove={handleTouchMove}
                className={`w-full h-full absolute inset-0 overflow-auto ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                style={{
                  backgroundImage: 'radial-gradient(#94a3b8 1.5px, transparent 1.5px)',
                  backgroundSize: '32px 32px',
                  backgroundColor: '#f8fafc'
                }}
              >
                <div className="min-w-max p-16 pb-32 pt-20">
                  <div className="org-tree">
                    <ul>
                      {data.map(node => (
                        <OrgNode 
                          key={node.id} 
                          node={node} 
                          onAdd={handleAdd}
                          onUpdate={handleUpdate}
                          onDelete={handleDelete}
                          onToggle={handleToggle}
                          isExportingPDF={false}
                        />
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>

            {/* 2. ディレクトリマップ表 (分割なしで全面広々と表示) */}
            <div className={`flex-1 overflow-auto bg-white ${activeTab === 'table' ? 'block' : 'hidden'}`}>
              <DirectoryMap data={data} onShowToast={showToast} isExportingPDF={false} />
            </div>

          </main>

          {/* ファイル名入力用のカスタムモーダル */}
          {isNamingModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form 
                onSubmit={handleConfirmPDF}
                className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full p-6 animate-fade-in-up"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 mb-4 text-slate-800">
                  <div className="bg-indigo-50 p-2.5 rounded-xl text-indigo-600">
                    <i data-lucide="printer" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 className="font-bold text-lg">PDFをダウンロード</h3>
                    <p className="text-xs text-slate-500">保存するファイルの名前を指定してください</p>
                  </div>
                </div>
                
                <div className="mb-6">
                  <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">ファイル名</label>
                  <div className="relative flex items-center">
                    <input 
                      type="text" 
                      required
                      autoFocus
                      value={pdfFileName}
                      onChange={e => setPdfFileName(e.target.value)}
                      placeholder="sitemap_and_directory"
                      className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm font-medium text-slate-800 pr-12 transition-all"
                    />
                    <span className="absolute right-4 text-xs font-semibold text-slate-400">.pdf</span>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button 
                    type="button"
                    onClick={() => setIsNamingModalOpen(false)}
                    className="flex-1 py-3 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    type="submit"
                    className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md shadow-indigo-100 transition-colors"
                  >
                    保存する
                  </button>
                </div>
              </form>
            </div>
          )}

          <Toast message={toastMessage} onClose={() => setToastMessage('')} />
        </div>
      );
    }

    const customCSS = `
      .org-tree { display: flex; justify-content: center; }
      .org-tree ul { padding-top: 24px; position: relative; display: flex; justify-content: center; padding-left: 0; margin: 0; }
      .org-tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 24px 12px 0 12px; }
      
      .org-tree li::before, .org-tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #cbd5e1; width: 50%; height: 24px; }
      .org-tree li::after { right: auto; left: 50%; border-left: 2px solid #cbd5e1; }
      
      .org-tree li:only-child::after, .org-tree li:only-child::before { display: none; }
      .org-tree li:only-child { padding-top: 0; }
      
      .org-tree li:first-child::before, .org-tree li:last-child::after { border: 0 none; }
      .org-tree li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 6px 0 0; }
      .org-tree li:first-child::after { border-radius: 6px 0 0 0; }
      
      .org-tree ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #cbd5e1; width: 0; height: 24px; transform: translateX(-50%); }
      
      .org-tree > ul { padding-top: 0; }
      .org-tree > ul::before { display: none; }
    `;

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
